general =
{
name = "%h"; // Advertise the exact system hostname; unlike the default %H, this does not capitalise it.
dbus_service_bus = "system";
};

sessioncontrol = { };

alsa =
{
	output_device = "default"; // the name of the alsa output device. Use "shairport-sync -h" to discover the names of ALSA hardware devices. Use "alsamixer" or "aplay" to find out the names of devices, mixers, etc.
//	mixer_control_name = "PCM"; // the name of the mixer to use to adjust output volume. No default. If not specified, no mixer is used and volume in adjusted in software.
//	mixer_control_index = 0; // the index of the mixer to use to adjust output volume. Default is 0. The mixer is fully identified by the combination of the mixer_control_name and the mixer_control_index, e.g. "PCM",0 would be such a specification.
disable_standby_mode = "always"; // This setting prevents the DAC from entering the standby mode. Some DACs make small "popping" noises when they go in and out of standby mode. Settings can be: "always", "auto" or "never". Default is "never", but only for backwards compatibility. The "auto" setting prevents entry to standby mode while Shairport Sync is in the "active" mode. You can use "yes" instead of "always" and "no" instead of "never".
};

//dsp =
//{
//	loudness = "no";
//	loudness_reference_volume_db = -20.0;
//};

metadata =
{
enabled = "yes";
include_cover_art = "yes";
cover_art_cache_directory = "/tmp/shairport-sync/.cache/coverart";
pipe_name = "/tmp/shairport-sync-metadata";
};

// Appliance policy: keep shairport-sync quiet. log_verbosity 0 means only
// errors are emitted (shairport-sync is invoked without -v), and statistics
// reporting is disabled, so no routine chatter is produced.
diagnostics =
{
	log_verbosity = 0;
	statistics = "no";
	// shairport-sync 5.x defaults to AirPlay-2 plist metadata (get_plist_metadata =
	// "yes"), which is delivered only over the D-Bus/MPRIS interface and is NEVER
	// written to the metadata FIFO (pipe_name above) that this app's reader consumes.
	// Force the classic DMAP metadata path so track/artist/album and cover art reach
	// the pipe as before. Upstream marks this option "Deprecated"; if a future pin
	// bump removes it, migrate the reader to the D-Bus/MPRIS metadata instead.
	get_plist_metadata = "no";
};

