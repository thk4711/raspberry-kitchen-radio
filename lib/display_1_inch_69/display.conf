[display]
width = 240
height = 280
rst = 24
dc = 25
bl = 22
spi_freq = 40000000

# ---------------------------------------------------------------------------
# [ui] — now-playing display theme (Workstream 5). Every key below is OPTIONAL.
# The values shown are the shipped defaults; leaving a key commented out (or the
# whole section absent) keeps the default, so the out-of-the-box look is
# unchanged. Colours accept "#RRGGBB", an "r, g, b" triple, or the names WHITE /
# BLACK. A malformed value is ignored (the default is used) and never blocks
# boot. Note: art treatment (radio backdrop vs. full-bleed cover) is chosen per
# source by the app, not here.
#
# To change a value, uncomment the line and edit only the value — do NOT add a
# trailing comment on the same line (the whole right-hand side is the value).
# ---------------------------------------------------------------------------
[ui]
# Safe-area / chrome geometry (px; scrim_opacity is 0..1):
#   safe_inset          kept clear of the rounded physical corners
#   top_band_height     top chrome band (source badge / clock / play-pause)
#   bottom_band_height  bottom band (title + artist rows / volume OSD)
#   scrim_opacity       darkening of the chrome bands over the art
#   backdrop_blur       blur radius of the radio-mode dominant-colour backdrop
# safe_inset = 14
# top_band_height = 44
# bottom_band_height = 82
# scrim_opacity = 0.55
# backdrop_blur = 18

# Radio-mode backdrop contrast. The backdrop is a gradient of the logo's
# dominant colour, kept deliberately darker than the (usually bright) logo so
# the centred tile stands out. Smaller top/bottom scales => darker backdrop =>
# more contrast; backdrop_logo_blend is how much of the blurred logo is mixed
# in (higher => background looks like a blurry copy of the tile => less
# contrast). Raise the scales if you prefer a brighter, lower-contrast look.
# backdrop_top_scale = 0.55
# backdrop_bottom_scale = 0.20
# backdrop_logo_blend = 0.20

# Typography sizes (px): title (bold), artist, small (badge/volume OSD), clock
# (top status-strip time), and the large idle-clock + date sizes for the
# screensaver.
# title_size = 30
# artist_size = 22
# small_size = 17
# clock_size = 24
# clock_large_size = 64
# date_size = 20

# Colours. no_art_color is the neutral backdrop when a radio logo can't be
# colour-sampled.
# text_color = WHITE
# subtext_color = 200, 200, 200
# shadow_color = BLACK
# background_color = BLACK
# no_art_color = 32, 32, 40

# Volume OSD (shown briefly when the knob turns): duration (s), bar height (px)
# and the track/fill colours.
# osd_duration = 1.5
# osd_bar_height = 12
# osd_track_color = 70, 70, 78
# osd_fill_color = WHITE

# Preset toast (shown briefly on a preset button press): duration (s), pill
# background colour + opacity (0..1), and text colour.
# toast_duration = 1.6
# toast_bg_color = BLACK
# toast_opacity = 0.72
# toast_text_color = WHITE

# Motion. animations is a master switch; setting it false disables both the
# crossfade and the scrolling-text edge-fade. crossfade_ms (0 = off) and
# edge_fade_px (0 = off) tune them individually.
# animations = true
# crossfade_ms = 150
# edge_fade_px = 12

# Idle clock screensaver: idle_timeout (s) before it appears, and the
# gradient colours (also used by the boot splash).
# idle_timeout = 30
# idle_bg_top = 18, 18, 24
# idle_bg_bottom = 6, 6, 10



