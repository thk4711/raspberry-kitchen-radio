name: CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Tests and raw coverage (includes hardware-only code)
        run: pytest -q --cov --cov-report=term-missing
      - name: First-party application coverage gate
        run: coverage report --omit='lib/display/display_test.py' --fail-under=83
      - run: python3 scripts/check-release-consistency.py --skip-tag-check
      - run: python -m compileall -q lib radio.py tests
      - run: find buildroot -type f -name '*.sh' -exec sh -n {} \;
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: find buildroot -type f -name '*.sh' -exec shellcheck -S style {} +
      - run: ./scripts/check-repository.sh

  # The annotated release tag cannot be validated by the always-on gate above:
  # on a branch push the tag may not exist yet, and actions/checkout degrades an
  # annotated tag into a lightweight one when it checks out a tag ref. This job
  # runs only for pushed vX.Y.Z tags, re-fetches the real annotated tag object,
  # and validates its type and date against the changelog.
  release-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      # Restore the annotated tag object that the checkout of a tag ref drops,
      # so cat-file reports 'tag' (not the lightweight 'commit').
      - name: Restore annotated tag object
        run: git fetch --force --tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - name: Validate release consistency including the annotated tag
        run: python3 scripts/check-release-consistency.py
