name: Deploy pinout page to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate color-coded pinout HTML
        run: python3 scripts/generate-pinout-html.py
      - name: Upload Pages artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
