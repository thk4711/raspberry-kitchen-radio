# Built-in music-source feature flags.
#
# This shipped default enables every source. The web administration interface
# writes a managed override at /etc/radio/sources.ini which is layered on top of
# this file (see radio.py RadioController._load_source_flags and the POSIX-sh
# reader /usr/sbin/radio-source-enabled). A missing override file or key means
# "enabled", so a fresh image behaves exactly as if this file were the only one.
#
# Keys (all user-facing; never expose internal deps like D-Bus/Avahi as switches):
#   internet_radio  MPD internet radio
#   airplay         AirPlay receiver (shairport-sync)
#   spotify         Spotify Connect (go-librespot)
#   bluetooth       Bluetooth A2DP sink
#   usb_audio       USB Audio Class gadget
[sources]
internet_radio = true
airplay = true
spotify = true
bluetooth = true
usb_audio = true
