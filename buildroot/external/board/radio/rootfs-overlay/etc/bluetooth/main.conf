# Raspberry Kitchen Radio — BlueZ configuration for a headless A2DP audio sink.
#
# Goal: whenever NO device is connected the adapter must be discoverable and
# pairable with NO PIN, so any phone can connect; while a device is connected it
# stops advertising. The no-input/no-output auto-pairing agent and the
# connection-gated discoverable/pairable toggling are both driven by
# /etc/init.d/S42bluetooth (which is authoritative); this file only sets the
# adapter identity and disables BlueZ's own discoverable/pairable timeouts so the
# state the script sets is not silently reverted.

[General]
# Friendly name shown to phones. NOTE: this BlueZ build does NOT expand the
# `%h` hostname token here, so S42bluetooth sets the adapter *alias* (what
# phones actually display) at runtime via `bluetoothctl system-alias $(hostname)`.
# This value is kept only as a static fallback for the raw controller Name.
Name = %h
# Advertise as an audio device (major class Audio/Video). Helps phones present
# the correct icon and default to the A2DP (media) profile.
Class = 0x200414
# Only the profiles the radio needs: A2DP source(from the phone)/sink + AVRCP
# media control + the RFCOMM socket. No PAN/NAP/HID.
Enable = Source,Sink,Media,Socket
# Disable BlueZ's own timeouts: when S42bluetooth turns discoverable/pairable ON
# (no device connected) it must stay on until the script turns it OFF (a device
# connected), not time out on its own.
DiscoverableTimeout = 0
PairableTimeout = 0
# Leave the connection-gated pairable toggling to S42bluetooth. AlwaysPairable
# would force pairable back on even while a device is connected, fighting the
# script's "pairable off", so keep it false.
AlwaysPairable = false
[Policy]
# Prefer acting as the A2DP sink (we receive audio from the phone).
AutoEnable = true
