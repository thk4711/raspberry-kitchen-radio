# Raspberry Kitchen Radio — minimal MPD configuration.
music_directory     "/var/lib/mpd/music"
playlist_directory  "/var/lib/mpd/playlists"
db_file             "/var/lib/mpd/tag_cache"
state_file          "/var/lib/mpd/state"
sticker_file        "/var/lib/mpd/sticker.sql"
pid_file            "/run/mpd/mpd.pid"

user                "mpd"
bind_to_address     "localhost"
port                "6600"

# Appliance policy: produce no persistent logs. Discard MPD's log output to
# /dev/null and keep only warnings/errors (which are discarded anyway). This
# keeps the SD card and the RAM-backed tmpfs free of MPD log growth.
log_file            "/dev/null"
log_level           "warning"

# Output to the ALSA default (the I2S DAC via /etc/asound.conf dmix).
audio_output {
    type        "alsa"
    name        "DAC"
    device      "default"
    mixer_type  "hardware"
    mixer_control "Digital"
}

# Internet radio streams need curl input + mp3/aac/etc decoders (enabled in
# the mpd Buildroot package options).
input {
    plugin      "curl"
}

auto_update         "no"
