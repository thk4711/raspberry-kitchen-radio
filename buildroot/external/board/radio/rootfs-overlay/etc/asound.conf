# Raspberry Kitchen Radio — plain ALSA passthrough to the I2S DAC.
pcm.dmix0 {
    type dmix
    ipc_key 1024
    ipc_gid audio
    ipc_perm 0660
    slave {
        pcm "hw:0,0"
        rate 44100
        format S16_LE
        period_time 0
        period_size 1024
        buffer_size 4096
    }
    bindings {
        0 0
        1 1
    }
}

pcm.!default {
    type plug
    slave.pcm "dmix0"
}
