<!DOCTYPE busconfig PUBLIC
          "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
          "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Raspberry Kitchen Radio Bluetooth policy.

       The appliance runs everything (S42bluetooth's bluealsa / bluealsa-aplay /
       auto-pairing agent, and the radio.py app) as root, so grant root the
       ability to own org.bluealsa and to talk to both org.bluez and
       org.bluealsa. bluez5_utils ships its own /etc/dbus-1/system.d policy for
       org.bluez ownership; this file adds the bluealsa service and the radio's
       client access. -->
  <policy user="root">
    <allow own="org.bluealsa"/>
    <allow send_destination="org.bluez"/>
    <allow send_destination="org.bluealsa"/>
    <allow receive_sender="org.bluez"/>
    <allow receive_sender="org.bluealsa"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.bluealsa"/>
    <allow receive_sender="org.bluealsa"/>
  </policy>
</busconfig>
