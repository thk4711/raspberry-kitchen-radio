# Chrony configuration for the Raspberry Kitchen Radio Buildroot image.
#
# Raspberry Pi boards have no battery-backed RTC, so the clock starts near 1970
# on every cold boot. TLS clients such as go-librespot need a valid wall clock
# before they can verify server certificates. Use public NTP pools and allow a
# large initial step so the clock becomes sane quickly after WiFi comes up.

pool pool.ntp.org iburst

# Step the clock when the offset is larger than one second. The negative limit
# means this is allowed at any time, which is useful for an RTC-less appliance.
makestep 1.0 -1

driftfile /var/lib/chrony/drift
rtcsync

# Keep logs on tmpfs/rootfs-friendly paths. Chrony's default syslog output is
# sufficient for normal operation; uncomment log measurements/statistics/tracking
# during deeper time-sync debugging if needed.
logdir /tmp