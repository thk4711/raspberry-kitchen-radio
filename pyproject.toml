[project]
name = "pisonic"
version = "0.3.1"
description = "Buildroot appliance that turns a Raspberry Pi into an internet radio / streaming device."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dynamic = []

[tool.pytest.ini_options]
# Run tests from the tests/ directory. The lib/ directory is added to the
# import path so `from music_source import ...`, `from alsa_controller import
# ...` etc. resolve exactly as they do at runtime, where radio.py does
# `sys.path.insert(0, .../lib)`.
testpaths = ["tests"]
pythonpath = ["lib", "."]
# ``-m 'not hardware'`` keeps the optional on-target smoke suite
# (tests/test_hardware_smoke.py, marked ``@pytest.mark.hardware``) out of the
# default/CI run: it needs a real Raspberry Pi with the audio HAT, SPI display,
# I2C ADC and amp GPIO wired up. A maintainer runs it on the device with
# ``pytest -m hardware``. See buildroot/README.md and doc/buildroot.md.
addopts = "-ra -m 'not hardware'"
markers = [
    "hardware: on-target smoke checks; require a real Pi. Skipped by default; run with -m hardware.",
]

[tool.coverage.run]
# Measure repository-owned runtime code. Reports may apply narrower omit rules,
# but collection remains broad so hardware/vendor coverage stays visible.
source = ["lib", "radio_web", "radio"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
# Target the oldest supported interpreter (see requires-python) so lint/format
# never suggest syntax unavailable on the appliance image or the CI floor.
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import-sort, B bugbear. Kept focused to fit the
# existing style. Pyupgrade (UP) is intentionally NOT enabled: the appliance
# floor is Python 3.9 and several annotations are evaluated at runtime, so
# PEP 604/585 rewrites would be unsafe there.
#
# FA102 (flake8-future-annotations) is enabled on purpose: it flags PEP 604
# unions (``X | Y``) used at runtime in a module WITHOUT
# ``from __future__ import annotations``. That syntax is evaluated at import
# time and raises ``TypeError`` on the Python 3.9 floor, so FA102 catches this
# class of 3.9-only breakage locally instead of only in the 3.9 CI leg. Only
# FA102 is selected (not the whole FA group): FA100 would demand converting the
# codebase's pervasive ``typing.Optional`` usage, which is deliberate churn we
# do not want.
select = ["E", "F", "W", "I", "B", "FA102"]
# E501 (line length) is enforced by the formatter, not the linter.
# E402 (import not at top): several entry points intentionally manipulate
#   sys.path before importing, and defer hardware imports; those sites already
#   carry local noqa where needed.
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
# Tests import stubs and reach into internals; relax import rules there.
"tests/*" = ["E402", "F401", "B017"]
# lcdconfig.py is Waveshare-derived: it uses ``from gpiozero import *``
# (F403/F405), C-style ``== None`` comparisons (E711), and a
# DigitalOutputDevice() default-argument construction (B008).
# The panel driver files (panel_st7789.py, panel_gc9a01.py, panel_base.py)
# use clean named imports and do not need wildcard-import suppression.
"lib/display/lcdconfig.py" = ["F403", "F405", "E711", "B008"]

[tool.mypy]
# mypy itself no longer accepts 3.9 as a target; use 3.10 for the checker while
# the runtime floor stays 3.9 via [project] requires-python (ruff targets py39).
python_version = "3.10"
# The hardware/system-only libraries are stubbed at runtime and have no type
# stubs; do not fail on their missing imports. numpy ships stubs that use newer
# syntax than this checker target, so we do not follow into them either.
ignore_missing_imports = true
follow_imports = "silent"
warn_redundant_casts = true
check_untyped_defs = true
# Check every first-party production Python file. Tests are validated by pytest
# and compileall.
files = [
    "radio.py",
    "lib",
    "radio_web",
    "scripts",
]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
