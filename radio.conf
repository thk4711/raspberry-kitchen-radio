[mpd]
host = localhost
port = 6600

[gpio]
amp = 26

[metadata]
update_interval = 3

[audio]
mixer = Digital

[spotify]
host = localhost
port = 3678

[airplay]
pipe_path = /tmp/shairport-sync-metadata

[bluetooth]
# BlueZ D-Bus well-known name. The Bluetooth A2DP stack (bluetoothd, bluealsa,
# bluealsa-aplay and the no-PIN auto-pairing agent) is started and supervised by
# the appliance init script /etc/init.d/S42bluetooth; the radio app only reads
# AVRCP metadata and issues play/pause over this D-Bus service.
dbus_service = org.bluez

[adc]
# I2C address of the ADS1115 (hex accepted, parsed with base 0).
i2c_address = 0x48
# Linux I2C bus number (/dev/i2c-1 on Raspberry Pi 3A+).
i2c_bus = 1
# Volume knob ADC calibration (millivolts) mapped to 0..100.
volume_min_input = 0.93
volume_max_input = 3282
# Button ladder ADC calibration and detection tolerance (millivolts).
button_min = 100
button_max = 3100
button_tolerance = 150

[logging]
# Optional log level: DEBUG, INFO, WARNING, ERROR, CRITICAL.
# Overridden by the RADIO_LOG_LEVEL environment variable when set.
# level = ERROR

[watchdog]
# Liveness heartbeat for the appliance freeze-watcher (Buildroot init script
# /etc/init.d/S90radio). radio.py refreshes this file's timestamp on every
# metadata-loop iteration; if it goes stale the app is killed and restarted so
# a hung-but-alive process cannot leave the radio unusable.
#
# The RADIO_HEARTBEAT_FILE environment variable (exported by S90radio) overrides
# heartbeat_file so the app and the watcher always agree on the path.
# heartbeat_file = /tmp/radio.alive
# Set to false to disable the heartbeat entirely.
# enabled = true
