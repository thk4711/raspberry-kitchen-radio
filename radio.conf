[mpd]
host = localhost
port = 6600

[gpio]
# Legacy fallback retained for one rollback generation. Current firmware derives
# the amplifier GPIO from /etc/radio/audio_hardware.ini and the profile catalog.
amp = none

[metadata]
update_interval = 3

[audio]
# Legacy fallback retained for one rollback generation. Current firmware derives
# the mixer from the selected sound-card profile.
mixer = PCM

[volume]
# Maximum output volume (0..100) the physical knob is allowed to reach. 100 is
# uncapped (the default). Managed by the web administration interface via
# /etc/radio/audio.ini, which layers over this value.
# max = 100

[spotify]
host = localhost
port = 3678

[airplay]
pipe_path = /tmp/shairport-sync-metadata
# Local inhibit marker. When another music source takes over, the app pauses the
# AirPlay sender over D-Bus (best effort; only guaranteed for classic AirPlay,
# and for AirPlay 2 only on the shairport-sync development branch) and always
# creates this marker so source arbitration treats AirPlay as stopped regardless.
# It is cleared automatically once the AirPlay session itself ends, so a later
# stream can take over. Overridden by RADIO_AIRPLAY_INHIBIT_FILE when set.
inhibit_file = /run/airplay-inhibited

[usb_audio]
# Stable ALSA card ID created by the ConfigFS UAC1 function.
card = UAC1Gadget
# Shared with S39usb-audio; inhibits routing until the current host stream closes.
inhibit_file = /run/usb-audio-inhibited

[bluetooth]
# BlueZ D-Bus well-known name. The Bluetooth A2DP stack (bluetoothd, bluealsa,
# bluealsa-aplay and the no-PIN auto-pairing agent) is started and supervised by
# the appliance init script /etc/init.d/S42bluetooth; the radio app only reads
# AVRCP metadata and issues play/pause over this D-Bus service.
dbus_service = org.bluez

[adc]
# I2C address of the ADS1115 (hex accepted, parsed with base 0).
i2c_address = 0x48
# Linux I2C bus number (/dev/i2c-1 on Raspberry Pi 3A+).
i2c_bus = 1
# Volume knob ADC calibration (millivolts) mapped to 0..100.
volume_min_input = 0.93
volume_max_input = 3282
# Button ladder ADC calibration and detection tolerance (millivolts).
button_min = 100
button_max = 3100
button_tolerance = 150
# Power switch is interpreted as ON at or below this reading (millivolts).
switch_threshold = 300

[adc_status]
# Volatile, read-only telemetry consumed by the authenticated ADC debug page.
# file = /tmp/radio-adc.json
# enabled = true

[logging]
# Optional log level: DEBUG, INFO, WARNING, ERROR, CRITICAL.
# Overridden by the RADIO_LOG_LEVEL environment variable when set.
# level = ERROR

[watchdog]
# Liveness heartbeat for the appliance freeze-watcher (Buildroot init script
# /etc/init.d/S90radio). radio.py refreshes this file's timestamp on every
# metadata-loop iteration; if it goes stale the app is killed and restarted so
# a hung-but-alive process cannot leave the radio unusable.
#
# The RADIO_HEARTBEAT_FILE environment variable (exported by S90radio) overrides
# heartbeat_file so the app and the watcher always agree on the path.
# heartbeat_file = /tmp/radio.alive
# Set to false to disable the heartbeat entirely.
# enabled = true

[status]
# Read-only JSON status snapshot published for the web administration interface
# (radio_web). radio.py rewrites this file atomically
# on every metadata-loop iteration with display-safe fields only (active source,
# now-playing name/title/state, per-source play state). It never contains stream
# URLs or secrets. Lives in tmpfs by design (volatile, cleared on reboot).
#
# The RADIO_STATUS_FILE environment variable overrides the path below.
# file = /tmp/radio-status.json
# Set to false to disable publishing the snapshot entirely.
# enabled = true
