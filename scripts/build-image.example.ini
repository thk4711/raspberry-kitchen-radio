# Copy this file to build-image.ini (which is git-ignored), then replace the
# dummy values needed by your build setup. Command-line options override it.
[build_image]

# Build on this machine by default. Change to "remote" to use SSH.
execution = local

# Portable local example. Tilde expansion is supported in local mode.
buildroot_dir = ~/embedded/buildroot
download_cache = ~/embedded/dl
artifacts_dir = ~/radio-artifacts
# Parallel make jobs on the build host. Omit to auto-detect the build host's
# core count (recommended — a remote build then scales to the remote machine).
# Set a number only to cap parallelism.
# jobs = 4
zip_image = true
install_host_packages = false

# Force a build even when the Buildroot checkout is dirty or not at the pinned
# commit (development only; keep false for reproducible release builds).
# allow_unverified_buildroot = false

# Remote mode example (ignored in local mode). No real host/user is provided.
# execution = remote
# host = build-user@build-host.example
# Set only when SSH does not listen on the default port 22.
# ssh_port = 22
# remote_root = /home/build-user/embedded
# buildroot_dir = /home/build-user/embedded/buildroot
# download_cache = /home/build-user/embedded/dl
# delete_remote_files = true
