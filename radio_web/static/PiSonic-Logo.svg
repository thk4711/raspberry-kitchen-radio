<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="950" height="690" viewBox="308 148 950 690" role="img" aria-labelledby="title desc">
  <title id="title">PiSonic Logo</title>
  <desc id="desc">PiSonic project logo with a blue audio waveform symbol above green and dark navy PiSonic text.</desc>

  <defs>
    <linearGradient id="blueBar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b57d0"/>
      <stop offset="48%" stop-color="#0b70ee"/>
      <stop offset="100%" stop-color="#0758d6"/>
    </linearGradient>

    <linearGradient id="darkBar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#142435"/>
      <stop offset="100%" stop-color="#061423"/>
    </linearGradient>

    <linearGradient id="sideDash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7e8b9a"/>
      <stop offset="100%" stop-color="#536274"/>
    </linearGradient>

    <linearGradient id="greenText" x1="358" y1="590" x2="560" y2="785" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05703d"/>
      <stop offset="100%" stop-color="#004e2a"/>
    </linearGradient>

    <linearGradient id="navyText" x1="578" y1="586" x2="1192" y2="785" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06182c"/>
      <stop offset="100%" stop-color="#071324"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="8" dy="12" stdDeviation="10" flood-color="#0b1724" flood-opacity="0.13"/>
    </filter>

    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="7" dy="10" stdDeviation="9" flood-color="#0b1724" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g id="audio-mark" filter="url(#softShadow)">
    <rect x="418" y="356" width="88" height="32" rx="16" fill="url(#sideDash)"/>
    <rect x="532" y="282" width="65" height="178" rx="32.5" fill="url(#darkBar)"/>
    <rect x="628" y="241" width="76" height="252" rx="38" fill="url(#blueBar)"/>
    <rect x="729" y="181" width="79" height="370" rx="39.5" fill="url(#blueBar)"/>
    <rect x="833" y="241" width="76" height="252" rx="38" fill="url(#blueBar)"/>
    <rect x="940" y="282" width="64" height="178" rx="32" fill="url(#darkBar)"/>
    <rect x="1031" y="356" width="88" height="32" rx="16" fill="url(#sideDash)"/>
  </g>

  <g id="wordmark" filter="url(#textShadow)" font-family="Montserrat, Avenir Next, Arial Black, Arial, sans-serif" font-size="228" font-weight="900">
    <text x="342" y="766" fill="url(#greenText)">P</text>
    <text x="500" y="766" fill="url(#greenText)">i</text>
    <text x="579" y="766" fill="url(#navyText)" letter-spacing="-13">Sonic</text>
  </g>
</svg>